name: Validate profiles
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Re-download pinned CDC files and reproduce estimates
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
  reproduce:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript pipeline/setup.R
      - run: python pipeline/fetch_sources.py
      - run: python pipeline/fetch_sources.py --verify-only
      - run: Rscript pipeline/estimate.R
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: python tests/reproduction.py
